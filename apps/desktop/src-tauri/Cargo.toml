[package]
name = "crazy-baby-mama-defense-system"
version = "0.0.0"
description = "cbmds"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The desktop entry point lives in the lib so it can be reused across targets;
# `main.rs` just calls `run()`. Name is referenced from `main.rs`.
name = "cbmds_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Smaller, leaner release binaries for a lightweight desktop app.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
